name: ruby_cr
version: 0.1.0
crystal: ">= 1.21.0"
description: |
  Слой совместимости с stdlib Ruby для Crystal: версионные пространства
  Ruby::V3 (ruby 3.4.5) и Ruby::V4 (ruby 4.0.4) — обёртки/алиасы Ruby-API
  (Time/Date/DateTime/Random MT19937/Struct/Kernel.format/inspect), плюс
  аддитивные переоткрытия ::String/::Int/::Float/::Array/::Hash/::Set/
  ::Range недостающими методами Ruby. Паритет 1:1 сверяется оракулом
  twinshot: 562 кейса × 2 версии, бит-в-бит (см. DIFFERENCES.md).

authors:
  - oleg
